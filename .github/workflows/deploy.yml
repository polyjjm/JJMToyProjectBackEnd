name: Build and Push

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create application-prod.properties
        run: |
          cat << 'EOF' > src/main/resources/application-prod.properties
          ${{ secrets.APPLICATION_PROD_PROPERTIES }}
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/polyjjm/jjmtoyprojectbackend:latest