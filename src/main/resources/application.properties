server.port = 8081

# active profile controls which application-{profile}.properties supplies the datasource
# (application-local.properties for local MySQL, application-prod.properties for the old AWS host)
spring.profiles.active=local

# ?? ??? ??
spring.servlet.multipart.maxFileSize=50MB
spring.servlet.multipart.maxRequestSize=50MB
server.tomcat.max-http-header-size=16384



# jpa mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# mysql config


mybatis.mapper-locations=mybatis/mapper/*.xml


spring.datasource.url=jdbc:mysql://localhost:3306/toydb?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234




# Public, browser-reachable base URL for the same MinIO bucket (reverse-proxied) - the endpoint
# above is only for the backend's internal S3 API calls (docker-network hostname, not reachable
# from a real browser). Image URLs handed to the frontend are built from this instead of
# AmazonS3.getUrl(), which would otherwise bake in the internal "minio:9000" host.
cloud.aws.s3.public-url=https://img.jjmlab.com

#bucket
cloud.aws.s3.bucket=jjmserverbucket
cloud.aws.s3.endpoint=https://img.jjmlab.com
cloud.aws.credentials.access-key=${accessKey}
cloud.aws.credentials.secret-key=${secretKey}
cloud.aws.region.static=us-east-1
cloud.aws.region.auto=false
cloud.aws.stack.auto=false

jwt.secret=${jwtSecret}
# access/refresh token TTLs, in minutes
jwt.expiration=60
jwt.refresh-expiration=30000
oauth.kakao.redirect-uri=${kakaoUri}
oauth.kakao.client-id=${kakaoClientId}
logging.level.com.amazonaws.util.EC2MetadataUtils: error



